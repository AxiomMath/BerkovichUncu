# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "BerkovichUncu"
  authors: [Kenny Lau]
  description: >
    `BerkovichUncu` is a formal proof of the statistic-transfer lemmas behind the bijection of
    *A bijective proof of a partition theorem of Berkovich and Uncu* (arXiv:2608.05142). It proves
    Lemma 2.5, Lemma 2.10, Lemma 2.14 and Lemma 2.17, which track the residue and multiplicity
    statistics through the four maps $\varphi$, $\Phi$, $\psi^{-1}$ and Glaisher's $G$.
    The Lean files were generated by AxiomProver, Axiom Math's in-house theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "MIT"

repository:
  role: "substantive-development"

sources:
  - title: "A bijective proof of a partition theorem of Berkovich and Uncu"
    authors: [Michal Mogielnicki, Ken Ono, Niels Voss, Jujian Zhang]
    id: "https://arxiv.org/abs/2608.05142"
    type: "article"
    location: "Lemma 2.5, Lemma 2.10, Lemma 2.14, Lemma 2.17"
    relationship: "formalizes"
    note: >
      Formalizes the four lemmas that carry the statistics through the composite bijection.

classification:
  arxiv: [math.CO]
  msc2020: [05A17, 05A19, 68V15]

status:
  scope: >
    Lemma 2.5, Lemma 2.10, Lemma 2.14 and Lemma 2.17, for every $n$. The bijections themselves are
    supplied to `problem.lean` as data, and the assembly of the four lemmas into the bijection
    $F$ and the resulting cardinality statement is carried out in `problem.lean`.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "BerkovichUncu.phi_stat"
    file: "BerkovichUncu/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
  - declaration: "BerkovichUncu.Phi_stat"
    file: "BerkovichUncu/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
  - declaration: "BerkovichUncu.psiInv_oddMultiplicity"
    file: "BerkovichUncu/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
  - declaration: "BerkovichUncu.G_oddPart"
    file: "BerkovichUncu/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"

automation:
  methods:
    - method: "autonomous"
      models: [AxiomProver]

review:
  status: "author-verified"
  reviewers: [Kenny Lau]
  notes: >
    The formal challenge in `BerkovichUncu/problem.lean` was checked against the source paper by
    an author of that paper.

alignment:
  statements:
    - source: "A bijective proof of a partition theorem of Berkovich and Uncu (Lemma 2.5)"
      lean: "BerkovichUncu.phi_stat"
      module: "BerkovichUncu.solution"
      status: "Proved."
    - source: "A bijective proof of a partition theorem of Berkovich and Uncu (Lemma 2.10)"
      lean: "BerkovichUncu.Phi_stat"
      module: "BerkovichUncu.solution"
      status: "Proved."
    - source: "A bijective proof of a partition theorem of Berkovich and Uncu (Lemma 2.14)"
      lean: "BerkovichUncu.psiInv_oddMultiplicity"
      module: "BerkovichUncu.solution"
      status: "Proved."
    - source: "A bijective proof of a partition theorem of Berkovich and Uncu (Lemma 2.17)"
      lean: "BerkovichUncu.G_oddPart"
      module: "BerkovichUncu.solution"
      status: "Proved."
